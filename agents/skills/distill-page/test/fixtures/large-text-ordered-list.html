<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Large-text ordered list</title>
    <style>
      .large-text {
        font-size: 26px;
      }
    </style>
  </head>
  <body>
    <ol class="large-text">
      <li>First, a plain entry</li>
      <li>You put the <code>html</code> in the <code>markdown</code>, right</li>
    </ol>

    <ol>
      <li>
        <h2>Actual Heading</h2>
        <p>First paragraph</p>
        <p>Second!</p>
      </li>
    </ol>
  </body>
</html>
